name: Uitrollen naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Bouwen
        run: ./bouw.sh

      # Zelf inpakken: upload-pages-artifact kan verborgen mappen (.well-known) overslaan.
      - name: Inpakken
        run: tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      # GitHub vindt het pakket soms pas na een paar seconden, dus zo nodig nog een keer.
      - name: Uitrollen
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wachten
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Uitrollen, tweede poging
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # Meldt wijzigingen via IndexNow. De sleutel is bewust openbaar.
      - name: IndexNow
        continue-on-error: true
        run: |
          sleep 10
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data '{"host":"landhart.nl","key":"c75216060ea926e5bd09951197c99940","keyLocation":"https://landhart.nl/c75216060ea926e5bd09951197c99940.txt","urlList":["https://landhart.nl/","https://landhart.nl/privacy/"]}' \
            -w "\nIndexNow: HTTP %{http_code}\n"
